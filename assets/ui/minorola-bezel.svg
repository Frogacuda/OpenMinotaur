<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Minorola landscape bezel</title>
  <desc id="description">Dark glass and a silver rim surrounding a transparent 4:3 opening. The gray minorola wordmark sits below the earpiece, opposite a reflective home key engraved with a sheep.</desc>
  <defs>
    <clipPath id="outside-screen">
      <path clip-rule="evenodd" d="M0 0H1920V1080H0Z M290 30H1630A10 10 0 0 1 1640 40V1040A10 10 0 0 1 1630 1050H290A10 10 0 0 1 280 1040V40A10 10 0 0 1 290 30Z"/>
    </clipPath>
    <clipPath id="glass-edge">
      <rect x="16" y="13" width="1888" height="1054" rx="93"/>
    </clipPath>
    <linearGradient id="metal" x1=".17" y1="0" x2=".83" y2="1">
      <stop stop-color="#5b6066"/><stop offset=".06" stop-color="#acafb1"/>
      <stop offset=".14" stop-color="#e0e1de"/><stop offset=".27" stop-color="#636971"/>
      <stop offset=".49" stop-color="#959a9d"/><stop offset=".70" stop-color="#4b5157"/>
      <stop offset=".92" stop-color="#b7bcbd"/><stop offset="1" stop-color="#50545a"/>
    </linearGradient>
    <linearGradient id="glass" x1=".35" y1="0" x2=".65" y2="1">
      <stop stop-color="#1a1c1e"/><stop offset=".32" stop-color="#111316"/>
      <stop offset=".66" stop-color="#080a0b"/><stop offset="1" stop-color="#1b1e21"/>
    </linearGradient>
    <linearGradient id="reflection" x1=".35" y1="0" x2=".65" y2="1">
      <stop offset=".02" stop-color="#e2e9ee" stop-opacity=".21"/>
      <stop offset=".43" stop-color="#9ca9bc" stop-opacity=".10"/>
      <stop offset=".88" stop-color="#d0dae0" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="key-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a0a5a7"/><stop offset="1" stop-color="#4b4e52"/>
    </linearGradient>
    <pattern id="speaker-mesh" width="4.6" height="4.6" patternUnits="userSpaceOnUse">
      <rect width="4.6" height="4.6" fill="#181b1d"/>
      <circle cx="2.3" cy="2.3" r="1.1" fill="#45494b"/>
    </pattern>
    <linearGradient id="speaker-shade" x2="0" y2="1">
      <stop offset=".08" stop-color="#08090a"/><stop offset=".52" stop-color="#08090a" stop-opacity="0"/>
      <stop offset="1" stop-color="#141617"/>
    </linearGradient>
    <radialGradient id="lens-glass" cx=".38" cy=".28" r=".72">
      <stop offset=".04" stop-color="#657688"/><stop offset=".18" stop-color="#354454"/>
      <stop offset=".47" stop-color="#11161f"/><stop offset=".59" stop-color="#080a0e"/>
      <stop offset=".70" stop-color="#373b40"/><stop offset=".79" stop-color="#111315"/>
    </radialGradient>
    <linearGradient id="home-metal" x1=".20" y1=".10" x2=".80" y2=".90">
      <stop stop-color="#343a41"/><stop offset=".22" stop-color="#66717b"/>
      <stop offset=".42" stop-color="#a1a9af"/><stop offset=".66" stop-color="#626b73"/>
      <stop offset="1" stop-color="#262c31"/>
    </linearGradient>
    <linearGradient id="home-face" x1=".18" y1=".05" x2=".82" y2=".95">
      <stop offset=".01" stop-color="#626b74"/><stop offset=".29" stop-color="#343a41"/>
      <stop offset=".44" stop-color="#23282d"/><stop offset=".45" stop-color="#171a1e"/>
      <stop offset=".79" stop-color="#242a2f"/><stop offset=".99" stop-color="#3f474e"/>
    </linearGradient>
    <linearGradient id="engraving-silver" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e5e9ec"/><stop offset=".75" stop-color="#969ea4"/>
    </linearGradient>
  </defs>

  <g id="bezel" clip-path="url(#outside-screen)">
    <g id="side-keys" fill="url(#key-metal)" stroke="#30353a" stroke-width="2">
      <rect x="271" y="-1" width="230" height="8" rx="2"/>
      <rect x="1" y="751" width="8" height="129" rx="2"/>
    </g>
    <g id="chassis">
      <rect x="3.5" width="1913" height="1080" rx="105" fill="url(#metal)"/>
      <rect x="4.5" y="1" width="1911" height="1078" rx="104" fill="none" stroke="#e0e3e4" stroke-opacity=".58" stroke-width="2"/>
      <rect x="14" y="11" width="1892" height="1058" rx="95" fill="#070809"/>
    </g>
    <g id="face-glass" clip-path="url(#glass-edge)">
      <rect x="16" y="13" width="1888" height="1054" fill="url(#glass)"/>
      <path d="M1053 13H1904V930L1791 1067Z" fill="url(#reflection)"/>
      <rect x="17" y="14" width="1886" height="1052" rx="92" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2"/>
    </g>
    <g id="screen-edge">
      <rect x="272" y="22" width="1376" height="1036" rx="18" fill="#050607"/>
      <rect x="276" y="26" width="1368" height="1028" rx="14" fill="#17191b" stroke="#7b8386" stroke-opacity=".38" stroke-width="2"/>
      <rect x="279" y="29" width="1362" height="1022" rx="11" fill="#080a0d"/>
    </g>
    <g id="receiver" transform="translate(125 540) rotate(-90)">
      <circle id="camera" cx="-117" cy="0" r="13" fill="url(#lens-glass)" stroke="#060709" stroke-width="2"/>
      <g id="earpiece">
        <rect x="-71" y="-15" width="142" height="30" rx="15" fill="#131618" stroke="#414649" stroke-width="2"/>
        <rect x="-65" y="-10" width="130" height="20" rx="10" fill="url(#speaker-mesh)"/>
        <rect x="-65" y="-10" width="130" height="20" rx="10" fill="url(#speaker-shade)"/>
      </g>
      <g id="minorola-wordmark" transform="translate(-109 38) scale(.514)" fill="none" stroke="#aab0b5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 71V30m0 20c0-13 8-21 19-21s18 8 18 19v23m0-21c0-13 8-21 19-21s18 8 18 19v23M105 31v40M127 71V30m0 20c0-13 8-21 20-21s19 8 19 19v23M250 71V30m0 20c0-12 8-21 20-21M351 71V7M416 30v41"/>
        <circle cx="105" cy="7" r="7.5" fill="#aab0b5" stroke="none"/>
        <circle cx="210" cy="50" r="22"/>
        <circle cx="309" cy="50" r="22"/>
        <circle cx="394" cy="50" r="22"/>
      </g>
    </g>
    <g id="home-button" transform="translate(1763 540) rotate(-90)">
      <circle r="89" cy="2" fill="#0a0c0e"/>
      <circle r="84" fill="url(#home-metal)" stroke="#080a0d" stroke-width="2"/>
      <circle r="77" fill="#15191c"/>
      <circle r="74" fill="url(#home-face)"/>
      <path d="M-63 -40A74 74 0 0 1 63 -40" fill="none" stroke="#c2d2e0" stroke-opacity=".15" stroke-width="2"/>
      <g id="sheep-engraving" transform="scale(.39) translate(-136 -142.5)" fill="none" stroke="url(#engraving-silver)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M62 89 C44 85 34 71 40 55 C46 37 65 31 80 38 C91 42 97 50 101 58 C106 43 118 34 135 34 C151 34 164 44 170 58 C177 43 192 34 208 35 C226 36 238 48 236 64 C235 77 225 86 211 90 C228 95 237 106 236 122 C235 138 224 148 211 153 C226 158 236 170 236 186 C235 202 220 213 206 213 C196 214 187 209 179 202 L180 222 C192 221 199 230 195 240 C191 250 176 250 170 242 C165 236 167 225 167 209 C160 217 149 220 136 220 C124 220 114 216 106 209 C106 226 106 237 101 243 C93 252 78 247 77 238 C74 228 81 222 92 222 L93 201 C85 210 74 215 63 213 C48 211 36 201 36 186 C36 170 46 158 62 153 C46 148 36 137 36 122 C36 106 46 95 62 91 Z"/>
        <path d="M105 72 H167 V112 C167 129 153 142 136 142 C119 142 105 129 105 112 Z"/>
        <path d="M116 90 Q124 81 132 90 M140 90 Q148 81 156 90"/>
      </g>
    </g>
  </g>
</svg>
